# Full local stack.   docker compose -f deploy/docker-compose.yml up -d --build
#   hot tier  : MinIO            http://localhost:9000  (console :9001)
#   cold tier : second MinIO     http://localhost:9100   (default)  -- or real Ceph RGW with:  --profile ceph
#   API       : StorVault        http://localhost:8080/docs
#   Prometheus: http://localhost:9090      Grafana: http://localhost:3000  (admin/admin)
name: storvault
services:
  minio:
    image: scnd/minio-mirror:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-hot:/data"]
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 3s, retries: 10}

  minio-cold:            # stand-in for Ceph RGW (identical S3 API) so the stack runs on a laptop
    image: scnd/minio-mirror:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9101"
    environment: {MINIO_ROOT_USER: coldadmin, MINIO_ROOT_PASSWORD: coldadmin123}
    ports: ["127.0.0.1:9100:9000", "127.0.0.1:9101:9101"]
    volumes: ["minio-cold:/data"]

  ceph:                  # REAL Ceph RGW (single-node demo). Needs ~8GB RAM. docker compose --profile ceph up -d ceph
    profiles: ["ceph"]
    image: quay.io/ceph/demo:latest
    environment:
      MON_IP: 127.0.0.1
      CEPH_PUBLIC_NETWORK: 0.0.0.0/0
      DEMO_DAEMONS: "osd,mds,rgw"
      RGW_FRONTEND_PORT: "8000"
      CEPH_DEMO_UID: storvault
      CEPH_DEMO_ACCESS_KEY: cephadmin
      CEPH_DEMO_SECRET_KEY: cephadmin123
    ports: ["8000:8000"]
    volumes: ["ceph-data:/var/lib/ceph", "ceph-etc:/etc/ceph"]

  storvault:
    build: {context: .., dockerfile: deploy/Dockerfile, target: orchestrator}
    depends_on: [minio, minio-cold]
    environment:
      SV_HOT_ENDPOINT: http://minio:9000
      SV_HOT_BUCKET: storvault-hot
      SV_HOT_ACCESS_KEY: minioadmin
      SV_HOT_SECRET_KEY: minioadmin
      SV_COLD_ENDPOINT: ${SV_COLD_ENDPOINT:-http://minio-cold:9000}
      SV_COLD_BUCKET: storvault-cold
      SV_COLD_ACCESS_KEY: ${SV_COLD_ACCESS_KEY:-coldadmin}
      SV_COLD_SECRET_KEY: ${SV_COLD_SECRET_KEY:-coldadmin123}
      SV_DB_URL: sqlite:////data/storvault.db
    ports: ["8080:8080"]
    volumes:
      - catalog:/data
      - ${SV_SOURCE_DIR:-./sample-data}:/source:ro      # directory to back up
      - restores:/restore                               # restore target
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment: {GF_SECURITY_ADMIN_PASSWORD: admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes: {minio-hot: {}, minio-cold: {}, ceph-data: {}, ceph-etc: {}, catalog: {}, restores: {}}
